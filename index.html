<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Biberfilm 2026 – Jugend Circus Biber</title>
  <meta name="description" content="Der Biberfilm 2026 des Jugend Circus Biber – produziert von LIVE MOUNTAIN.">
  <meta name="theme-color" content="#0a0a0b">

  <meta property="og:type" content="video.other">
  <meta property="og:title" content="Biberfilm 2026">
  <meta property="og:description" content="Der Film des Jugend Circus Biber – prod. by LIVE MOUNTAIN">
  <meta property="og:url" content="https://biberfilm.com/">
  <meta property="og:image" content="https://biberfilm.com/assets/img/logo_biber.png">

  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <header class="top">
      <a class="brand" href="./" aria-label="Biberfilm – Startseite">
        <img src="assets/img/logo_biber.png" alt="" width="40" height="40">
        <span>Jugend Circus Biber</span>
      </a>
      <span class="rec" aria-hidden="true"><i></i>REC</span>
    </header>

    <section class="hero">
      <p class="kicker">Jugend Circus Biber präsentiert</p>
      <h1 class="title">
        <span class="title__word">Biberfilm</span>
        <span class="title__year">2026</span>
      </h1>
      <p class="credit">
        prod. by
        <a href="https://www.livemountain.ch/" target="_blank" rel="noopener">LIVE MOUNTAIN<span aria-hidden="true">↗</span></a>
      </p>
    </section>

    <main class="stage">
      <div class="frame">
        <span class="corner corner--tl" aria-hidden="true"></span>
        <span class="corner corner--tr" aria-hidden="true"></span>
        <span class="corner corner--bl" aria-hidden="true"></span>
        <span class="corner corner--br" aria-hidden="true"></span>

        <div class="player">
          <!--
            YouTube-Link einsetzen:
            Aus https://www.youtube.com/watch?v=XXXXXXXXXXX die ID (XXXXXXXXXXX) nehmen
            und unten VIDEO_ID damit ersetzen.
          -->
          <iframe
            src="https://www.youtube-nocookie.com/embed/VIDEO_ID?rel=0&modestbranding=1&playsinline=1"
            title="Biberfilm 2026"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen></iframe>
        </div>
      </div>

      <div class="meta" aria-hidden="true">
        <span>JCB — 2026</span>
        <span>16:9</span>
        <span>▶ Play</span>
      </div>
    </main>

    <footer class="foot">
      <img class="foot__logo" src="assets/img/logo_biber.png" alt="Logo Jugend Circus Biber" width="120" height="120" loading="lazy">
      <p>© 2026 Jugend Circus Biber</p>
    </footer>

  </div>

</body>
</html>
